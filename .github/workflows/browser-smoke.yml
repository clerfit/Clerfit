name: Verify live calculator interactions

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'html/**'
      - 'css/**'
      - 'js/**'
      - 'sitemap.xml'
      - 'scripts/browser-smoke.js'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

concurrency:
  group: clerfit-live-browser-smoke
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout calculator source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run mobile browser smoke tests across all calculators
        env:
          CLERFIT_LIVE_BASE: https://clerfit.github.io/Clerfit/
        run: node scripts/browser-smoke.js "$CLERFIT_LIVE_BASE"
      - name: Upload browser smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clerfit-live-browser-smoke-report
          path: live-browser-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14
