name: ClerFit Phase 3 Boundary Guardrail

on:
  push:
    branches: [main, 'phase-3/**']
    paths:
      - 'FIELD_VALIDATION_AUDIT.csv'
      - 'INPUT_BOUNDARY_VERIFIED.csv'
      - 'tests/phase-three-boundary-structure.test.js'
      - 'tests/phase-three-runtime-fields.test.js'
      - 'js/advanced-calculators.js'
      - '.github/workflows/phase-three-boundary-guardrail.yml'
  pull_request:
    branches: [main]
    paths:
      - 'FIELD_VALIDATION_AUDIT.csv'
      - 'INPUT_BOUNDARY_VERIFIED.csv'
      - 'tests/phase-three-boundary-structure.test.js'
      - 'tests/phase-three-runtime-fields.test.js'
      - 'tests/phase-three-generated-unit-bounds.test.js'
      - 'js/advanced-calculators.js'
      - 'js/unit-system.js'
      - '.github/workflows/phase-three-boundary-guardrail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-boundary-guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate numeric boundary structure and inventory parity
        run: node tests/phase-three-boundary-structure.test.js
      - name: Audit generated advanced-calculator fields and semantic bounds
        run: node tests/phase-three-runtime-fields.test.js
      - name: Verify generated numeric bounds follow display-unit changes
        run: node tests/phase-three-generated-unit-bounds.test.js
