name: Formula regression checks

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - 'html/**'
      - '.github/workflows/formula-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - 'html/**'
      - '.github/workflows/formula-regression.yml'

permissions:
  contents: read

jobs:
  formula-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run known-answer and domain regressions
        run: node tests/verify.js
      - name: Run BMI page behavior regressions
        run: node tests/bmi-page.test.js
      - name: Run Body Fat page behavior regressions
        run: node tests/bodyfat-page.test.js
      - name: Run Lean Body Mass page behavior regressions
        run: node tests/leanmass-page.test.js
      - name: Run Fat Mass page behavior regressions
        run: node tests/fatmass-page.test.js
      - name: Run FFMI page behavior regressions
        run: node tests/ffmi-page.test.js
      - name: Run BSA page behavior regressions
        run: node tests/bsa-page.test.js
      - name: Run WHR page behavior regressions
        run: node tests/whr-page.test.js
      - name: Run WHtR page behavior regressions
        run: node tests/wht-page.test.js
      - name: Syntax-check every project JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js scripts/*.js tests/*.js; do
            node --check "$file"
          done

  bmi-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-test dependencies
        run: npm install --no-save @playwright/test @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/clerfit-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/html/BMI.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clerfit-http.log
          exit 1
      - name: Test BMI page interactions, responsive layout and accessibility
        run: npx playwright test tests/bmi-page.browser.spec.js tests/bodyfat-page.browser.spec.js tests/leanmass-page.browser.spec.js tests/fatmass-page.browser.spec.js tests/ffmi-page.browser.spec.js tests/bsa-page.browser.spec.js tests/whr-page.browser.spec.js tests/wht-page.browser.spec.js tests/waist-height-risk.browser.spec.js --reporter=list
