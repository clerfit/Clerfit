name: Formula regression checks

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/formula-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/formula-regression.yml'

permissions:
  contents: read

jobs:
  formula-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run known-answer and domain regressions
        run: node tests/verify.js
      - name: Check phase inventory, sign-off and sitemap integrity
        run: node tests/phase-register-integrity.test.js
      - name: Verify accessible input-validation errors
        run: node tests/input-validation-accessibility.test.js

      - name: Run page-specific calculator regressions
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/bmi-page.test.js \
            tests/bodyfat-page.test.js \
            tests/bsa-page.test.js \
            tests/fatmass-page.test.js \
            tests/ffmi-page.test.js \
            tests/leanmass-page.test.js \
            tests/whr-page.test.js \
            tests/wht-page.test.js; do
            node "$test_file"
          done
      - name: Syntax-check every project JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js scripts/*.js tests/*.js; do
            node --check "$file"
          done
