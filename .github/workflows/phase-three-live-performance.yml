name: ClerFit Phase 3 Live Performance and Headers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-three-live-performance.yml"
      - '404.html'
      - 'scripts/verify-production.js'
      - 'tests/404-base-path.test.js'
      - "PHASE_3_EXECUTION_REGISTER.csv"
      - "PHASE_3_EXECUTION_PLAN.md"
      - "PHASE_3_COMPLETION_REPORT.md"
      - "index.html"
      - "css/**"
      - "js/**"
      - "html/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse
        run: npm install --global lighthouse

      - name: Capture live route status and response headers
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = 'https://clerfit.github.io/Clerfit/';
          const paths = [
            '',
            'sitemap.xml',
            'robots.txt',
            'html/BMI.html',
            'html/bmi-for-age.html',
            'html/bmi-change.html',
            'contact.html'
          ];
          const records = [];
          for (const path of paths) {
            const url = new URL(path, base).href;
            try {
              const response = await fetch(url, { redirect: 'follow' });
              records.push({
                requestedUrl: url,
                finalUrl: response.url,
                status: response.status,
                ok: response.ok,
                headers: Object.fromEntries([
                  'content-type',
                  'content-length',
                  'cache-control',
                  'content-security-policy',
                  'strict-transport-security',
                  'x-content-type-options',
                  'x-frame-options',
                  'referrer-policy',
                  'permissions-policy',
                  'server',
                  'location'
                ].map(name => [name, response.headers.get(name)]))
              });
              await response.arrayBuffer();
            } catch (error) {
              records.push({ requestedUrl: url, error: String(error) });
            }
          }
          fs.writeFileSync('artifacts/live-response-headers.json', JSON.stringify(records, null, 2));
          console.log(JSON.stringify(records, null, 2));
          const required = records.filter(x =>
            /\/$/.test(x.requestedUrl) ||
            /sitemap\.xml$/.test(x.requestedUrl) ||
            /html\/(BMI|bmi-for-age|bmi-change)\.html$/.test(x.requestedUrl) ||
            /contact\.html$/.test(x.requestedUrl)
          );
          if (required.some(x => !x.ok)) {
            console.error('One or more required live routes did not return a successful status.');
            process.exitCode = 1;
          }
          NODE

      - name: Run mobile Lighthouse with simulated slow-network conditions
        run: |
          lighthouse https://clerfit.github.io/Clerfit/ \
            --chrome-flags="--headless --no-sandbox" \
            --form-factor=mobile \
            --throttling-method=simulate \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=artifacts/lighthouse-mobile.json

      - name: Summarize Lighthouse metrics
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'artifacts/lighthouse-mobile.json';
          if (!fs.existsSync(p)) {
            console.log('Lighthouse report was not generated; inspect the prior workflow step.');
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          const out = {
            requestedUrl: r.requestedUrl,
            finalUrl: r.finalDisplayedUrl,
            categories: Object.fromEntries(Object.entries(r.categories || {}).map(([k, v]) => [k, v.score])),
            metrics: Object.fromEntries(['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive'].map(k => [k, r.audits?.[k]?.displayValue ?? null])),
            warnings: (r.runWarnings || [])
          };
          fs.writeFileSync('artifacts/lighthouse-summary.json', JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Upload live performance and header evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clerfit-live-performance-and-headers
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
