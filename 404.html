<script>
(() => {
  // GitHub Pages keeps the requested (possibly deeply nested) 404 URL in the address bar.
  // Resolve this page's assets and navigation from the deployed site root without changing the UI.
  const pathname = window.location.pathname || '/';
  const lowerPath = pathname.toLowerCase();
  const marker = '/Clerfit/';
  const markerIndex = lowerPath.indexOf(marker.toLowerCase());
  const siteRoot = markerIndex >= 0 ? pathname.slice(0, markerIndex + marker.length) : '/';
  const base = document.createElement('base');
  base.href = new URL(siteRoot, window.location.origin).href;
  document.head.appendChild(base);
})();
</script>
